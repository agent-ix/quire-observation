[package]
name = "quire-observation"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false
description = "Qualified observation bindings and transport-independent valuations for Quire."
repository = "https://github.com/agent-ix/quire-observation"

[lib]
name = "quire_observation"
path = "src/lib.rs"

[workspace]
members = ["."]
resolver = "2"

[features]
# Exports owned test fixtures for downstream test code. Never enabled by default.
test-support = []

[dependencies]
qsl-foundation = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
quire-canonical = { version = "=0.3.0", git = "https://github.com/agent-ix/quire-canonical", branch = "main", features = ["serde_json"] }
quire-exact = { git = "https://github.com/agent-ix/quire-exact", branch = "main" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"

[dev-dependencies]
allocation-counter = "0.8.1"
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1" }
jsonschema = { version = "=0.56.0", default-features = false }
proptest = "=1.11.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
