[package]
name = "quire-observation"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false
description = "Qualified observation bindings and transport-independent valuations for Quire."
repository = "https://github.com/agent-ix/quire-observation"

[lib]
name = "quire_observation"
path = "src/lib.rs"

[workspace]
members = ["."]
resolver = "2"

[dependencies]
agent-ix-baseline-producer = { version = "=0.0.0", git = "https://github.com/agent-ix/filament-core-data", rev = "404288282402d60de007295ccbafa960532b955e" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"

[dev-dependencies]
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
