[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
# Keep the registry dependency allow-list permissive-only.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "quire-canonical" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-observation" },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Both git dependencies are pinned to a tag.
allow-git = [
    "https://github.com/agent-ix/ix-trace-rs",
    "https://github.com/agent-ix/quire-canonical",
]
